# sheet.fn.lambda.* — LET, LAMBDA and the lambda helper functions (Wave 7).
# All rows are EVALUATOR SPECIAL FORMS (`special_form: true`): they bind names
# and call lambdas, which a pure fn(&[Arg], &EvalCtx) kernel cannot do. They
# are handled in sheet-calc/src/eval/lambda.rs by substitution (see its module
# docs for the rulings); the pure dispatch door returns #NAME? for these rows.
# The parser scopes LET names / LAMBDA parameters (Expr::Local) and parses
# lambda calls (Expr::Call) — the Wave-7 AST amendment. `returns_array: true`
# marks the forms whose result may be a block so a formula rooted at one
# spills. Provenance: the public Microsoft documentation for each function.

- id: sheet.fn.lambda.let
  name: LET
  family: lambda
  arity: { min: 3, max: null }
  volatility: none
  range_aware: true
  returns_array: true
  special_form: true
  status: implemented
  provenance: ["Microsoft LET (public docs) — name1, value1, [name2, value2, …], calculation; names scoped to later values and the calculation"]
  tests:
    rust: ["sheet-conformance/tests/fn_lambda.rs::sheet_fn_lambda_let"]
    corpus: ["corpus/fn-corpus/lambda/let.golden.tsv"]

