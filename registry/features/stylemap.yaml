# sheet.style.* — visual style mapping into the IR-v2 style table (M1
# style-map track, spec §8.3, "the most important property of the whole
# plugin"). IR v2 ships the LoweredStyle table + per-cell styleKey; the
# Phase-B style-map track parses REAL visual attributes from XLSX
# (sheet-xlsx VisualStyles), resolves them into the LoweredContent.styles
# table (sheet-lower StyleResolver), and the SAME resolver feeds the grid
# scene (cross-surface parity). On the page surface, cell FILLS + BORDERS
# now land NATIVELY via tableCell-scoped properties (S-03 resolved; see
# sheet.lower.native-table); the tab-text FALLBACK lane
# (lower-to-mutations.ts) still prepares character-level overrides and
# reports fill/border as blocked — honest about its own limits.
# doc-style-group remains PLANNED (S-04: the style-management capability —
# run application through named styles — is an SDK gap).

- id: sheet.style.xlsx-visual-parse
  title: Parse xlsx font/fill/border/alignment (styles.xml xf records) into visual cell styles
  status: implemented
  provenance:
    ["ECMA-376 §18.8 (styles part)", "sheet-xlsx/src/parts/styles.rs::VisualStyles"]
  tests:
    rust: ["sheet-conformance/tests/stylemap.rs::sheet_style_xlsx_visual_parse"]
    corpus: ["corpus/xlsx-corpus/03-styles.xlsx"]

- id: sheet.style.ir-styles-table
  title: Emit a deduped LoweredStyle table with per-cell styleKey indices (IR v2)
  status: implemented
  provenance:
    ["spec §8.3", "sheet-lower IR v2 (LoweredStyle/styleKey)", "sheet-lower/src/style.rs::StyleResolver"]
  tests:
    rust: ["sheet-conformance/tests/stylemap.rs::sheet_style_ir_styles_table"]

- id: sheet.style.doc-style-group
  title: Map a LoweredStyle to a document style group on the host surface
  status: planned
  # BLOCKED on S-04 (the style-management capability — createCharacterStyle /
  # createParagraphStyle "new style from selection"). The translator PREPARES
  # the overrides (sheet.style.applystyle-pour); wiring them through a named
  # document style is the doc-style-group path, future. See BREAKAGE_LOG S-04.
  provenance: ["spec §8.3 — style group mapping", "S-04 style-management capability"]
  tests:
    rust: ["sheet-conformance/tests/stylemap.rs::sheet_style_doc_style_group"]

- id: sheet.style.applystyle-pour
  title: Apply-style pour — a cell's resolved style flows into the lowered/poured content as host overrides
  status: implemented
  provenance:
    - "spec §8.3 — style application on pour"
    - "lower-to-table.ts::tableDecorOps (native lane: cellFillColor + cell*EdgeStrokeWeight via tableCell scope)"
    - "lower-to-mutations.ts::styleEmissions (fallback lane: character props prepared; fill/border honestly blocked — S-04 run application still open)"
  tests:
    vitest:
      - "packages/sheet-host-model/test/lower-to-table.spec.ts"
      - "packages/sheet-host-model/test/lower-to-mutations.spec.ts"

# RULING (render-verified, not read-verified). A host `{type:"colorRef"}`
# value is a SWATCH ID, resolved by core's `Graphic::resolve` against the
# document's <Color>/<Swatch> tables — it is NOT a colour literal. Driving
# the real engine (CanvasModel + the CPU rasterizer) over the exact ops
# this plugin emits:
#   cellFillColor = "#FFEE00"                → 0 non-white pixels (unpainted)
#   cellFillColor = "Color/Black"            → a solid black cell
#   cellFillColor = a minted Color/uPagedSheet… → a solid #FFEE00 cell
#   characterFillColor = "#FF0000"           → glyph pixels BYTE-IDENTICAL to
#                                              setting no colour (black), because
#                                              the run paint picker ends in
#                                              `unwrap_or(default)`
# So both lowering lanes MINT a document swatch per distinct cell colour at
# the deterministic id palette.ts owns, and reference it by id. Second half
# of the ruling: core REFUSES a duplicate createSwatch and the refusal fails
# the whole Operation::Batch it rides in (verified — a batch led by a
# duplicate mint dropped its sibling fills), so a mint is skipped when the
# document already carries the id, and a FAILED swatch read mints nothing
# rather than gamble the decor batch.
- id: sheet.style.cell-colour-swatch-ref
  title: Cell fill / cell text colours are MINTED document swatches, never raw hex in a colorRef
  status: implemented
  provenance:
    - "core paged-model Graphic::resolve — a colorRef resolves by swatch id"
    - "core paged-renderer pipeline/tables.rs — an unresolved cell fill paints nothing"
    - "core paged-renderer pipeline/color_paint.rs::build_run_paint_picker — an unresolved run fill falls back to the default paint"
    - "lower-to-table.ts::cellFillSwatchOps + tableDecorOps (native lane)"
    - "lower-to-mutations.ts::cellTextSwatchOps + styleProps (fallback lane)"
    - "palette.ts — the one cellFill/cellText id convention, shared with the ADR-023 Swatches provider"
  tests:
    vitest:
      - "packages/sheet-host-model/test/lower-to-table.spec.ts"
      - "packages/sheet-host-model/test/palette.spec.ts"
      - "packages/sheet-bundle/test/lower-flow.spec.ts"

- id: sheet.style.cross-surface-parity
  title: A cell's visual style is identical on the page lowering and the grid scene (one style resolver)
  status: implemented
  provenance:
    ["spec §8.1/§8.3 — shared LoweredStyle wire shape", "sheet-lower StyleResolver feeds both surfaces"]
  tests:
    rust: ["sheet-conformance/tests/stylemap.rs::sheet_style_cross_surface_parity"]
