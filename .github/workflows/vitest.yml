name: vitest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-sheets
      - uses: actions/checkout@v4
        with:
          repository: paged-media/sdk
          path: sdk
          token: ${{ secrets.STATE_DISPATCH_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ------------------------------------------------------------------
      # REAL-ENGINE artifact (audit P3). This lane used to run vitest with
      # no wasm artifact, so sheet-bundle's engine-real.spec.ts skipIf gate
      # skipped the real boot on EVERY CI — the rust lane builds the
      # artifact but never runs vitest. Build it here (the exact recipe of
      # rust.yml's `wasm` job: pinned toolchain, Cargo.lock-pinned
      # wasm-bindgen-cli, pinned binaryen) so the real boot actually runs;
      # REQUIRE_REAL_ENGINE=1 below makes a missing artifact FAIL, not skip.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-sheets
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' plugin-sheets/Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"
      - name: build the engine wasm artifact (100 MB app wasm budget gate)
        run: bash plugin-sheets/scripts/build-wasm.sh
      # Fail-not-skip belt at the JOB level too: the vitest step below keeps
      # its deliberate `|| true` (red results still publish to state), so a
      # missing artifact must redden the job HERE, before vitest can skip.
      - name: real-engine artifact guard (fail, never skip)
        run: test -f plugin-sheets/packages/sheet-bundle/bin/sheet_js_bg.wasm
      # ------------------------------------------------------------------
      - name: install (sdk sibling satisfies the link chain)
        run: pnpm install --frozen-lockfile --dir plugin-sheets
      - name: contract-import lint (fail fast)
        run: node plugin-sheets/scripts/check-contract-imports.mjs
      - name: vitest (junit per package; red results still publish)
        env:
          # The spec-level half of the dual gate (engine-real.spec.ts):
          # under this env a missing artifact FAILS the suite instead of
          # letting the skipIf gate silently pass a vacuous run.
          REQUIRE_REAL_ENGINE: "1"
        run: |
          pnpm -r --no-bail --dir plugin-sheets exec \
            vitest run --reporter=junit --outputFile=junit.xml || true
          cat plugin-sheets/packages/*/junit.xml > junit-all.xml
          [ -s junit-all.xml ]
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-sheets,
      # suite=vitest, format=nextest-junit).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: junit-all.xml
          if-no-files-found: error
          retention-days: 14
