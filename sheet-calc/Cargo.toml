[package]
name = "sheet-calc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.sheet dependency graph, dirty propagation, topological recalc, cycle detection, volatility, deterministic RNG (spec §6.2)."

[lints]
workspace = true

[dependencies]
sheet-core = { path = "../sheet-core" }
sheet-parser = { path = "../sheet-parser" }
sheet-fn = { path = "../sheet-fn" }
rustc-hash.workspace = true
smallvec.workspace = true

[features]
# Thread-local work counters (src/perf.rs) for the perf budgets and benches.
# OFF in every shipped build: the release wasm (scripts/build-wasm.sh builds
# sheet-js with no features) carries no counter code at all.
perf-counters = []

[dev-dependencies]
# The crate's own tests/benches run WITH the counters (tests/perf_budgets.rs,
# benches/). A dev-dependency feature never reaches a non-test build.
sheet-calc = { path = ".", features = ["perf-counters"] }
# Wall-clock benches (benches/): trended, never gated — the gates are the
# count budgets in tests/perf_budgets.rs. No plotters/rayon.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "calc"
harness = false
